server:
  port: 8080
  address: 127.0.0.1

spring:
  application:
    name: care-gateway-service
  autoconfigure:
    exclude:
      # Without this, Boot invents a default user with a random password whenever validation is disabled
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000      # ms
        response-timeout: 10s
      routes:
        - id: claims-service
          uri: ${CLAIMS_SERVICE_URI:http://127.0.0.1:8082}
          predicates:
            - Path=/api/v1/claims/**
          filters:
            # Only GET is retried: replaying a POST could submit the same claim twice
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://127.0.0.1:8081}
          predicates:
            - Path=/api/v1/auth/**

gateway:
  security:
    # true (default): require a valid HS256 JWT on everything except /api/v1/auth/** and /actuator/health.
    # false: local happy-path demo only, no token needed.
    enabled: ${GATEWAY_SECURITY_ENABLED:true}
    jwt-secret: ${JWT_SECRET:}     # at least 32 characters; no default on purpose
    issuer: care-auth-service

management:
  endpoints:
    web:
      exposure:
        include: health,info